[package]
name = "martinus-desktop"
version = "0.1.0"
description = "Desktop shell for Martinus"
authors = ["Martin"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "martinus_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.3.1", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.7.0", features = [] }
tauri-plugin-opener = "2.4.0"
ureq = { version = "2.12.1", features = ["json"] }
